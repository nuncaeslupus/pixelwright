<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>pw view mockup r2</title>
<style>
/* Drafting table (light) and lightbox (dark). Chrome only: the canvas is always neutral gray. */
:root { --paper:#f2efe6; --sheet:#faf8f2; --ink:#1f1d1a; --dim:#7a756b; --rule:#d8d2c3; --hover:#e9e4d6;
  --red:#c2381f; --blue:#2f5f9e; --ochre:#9a6a1c; --green:#2f6a3c; --canvas:#7b7b7b;
  --serif:"Iowan Old Style","Charter","Bitstream Charter",Georgia,serif; --mono:ui-monospace,"DejaVu Sans Mono",Menlo,monospace; }
[data-theme=dark] { --paper:#1b1a18; --sheet:#232220; --ink:#e8e3d6; --dim:#948e81; --rule:#3a3732; --hover:#2d2b28;
  --red:#ef7a5f; --blue:#7fa8e6; --ochre:#d7a54f; --green:#79b884; --canvas:#5e5e5e; }
* { box-sizing:border-box; }
body { margin:0; background:var(--paper); color:var(--ink); font:13px/1.45 system-ui, sans-serif; }
.app { height:800px; display:flex; flex-direction:column; }
.top { height:44px; display:grid; grid-template-columns:1fr auto 1fr; align-items:center; padding:0 12px; border-bottom:1px solid var(--rule); }
.top .l, .top .r { display:flex; align-items:center; gap:10px; } .top .r { justify-content:flex-end; }
.name { font-family:var(--serif); font-size:17px; }
.meta { color:var(--dim); font-family:var(--mono); font-size:11px; }
.modes { display:flex; border:1px solid var(--rule); }
.modes span { padding:4px 14px; color:var(--dim); border-right:1px solid var(--rule); }
.modes span:last-child { border-right:0; } .modes .on { background:var(--ink); color:var(--paper); }
.modes .off { opacity:.35; }
.ib { width:28px; height:28px; display:inline-flex; align-items:center; justify-content:center; border:1px solid transparent; color:var(--dim); font-size:15px; }
.ib.b { border-color:var(--rule); }
.stamp { font-family:var(--mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase; padding:5px 10px; border:1.5px solid currentColor; }
.stamp.ok { color:var(--green); } .stamp.no { color:var(--red); }
.body { flex:1; display:flex; min-height:0; }
.work { flex:1; display:flex; flex-direction:column; min-width:0; }
.canvas { flex:1; background:var(--canvas); position:relative; display:flex; align-items:center; justify-content:center; gap:16px; overflow:hidden; }
.canvas canvas { image-rendering:pixelated; box-shadow:0 0 0 1px rgba(0,0,0,.35); }
.tag { position:absolute; font-family:var(--mono); font-size:11px; background:var(--sheet); color:var(--ink); padding:2px 6px; border:1px solid var(--rule); }
.side { width:310px; border-left:1px solid var(--rule); background:var(--sheet); display:flex; flex-direction:column; }
.tabs { display:flex; border-bottom:1px solid var(--rule); }
.tabs span { flex:1; text-align:center; padding:9px 0; color:var(--dim); border-bottom:2px solid transparent; }
.tabs .on { color:var(--ink); border-bottom-color:var(--ink); }
.tabs .n { font-family:var(--mono); font-size:10px; margin-left:4px; }
.pane { padding:12px; overflow:hidden; flex:1; }
.cap { font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--dim); margin:2px 0 8px; }
.verdict { border-left:2px solid var(--blue); padding:4px 0 4px 10px; margin-bottom:12px; }
.issue { display:grid; grid-template-columns:14px 1fr auto; gap:8px; padding:8px 0; border-top:1px solid var(--rule); }
.issue.sel { background:var(--hover); margin:0 -12px; padding:8px 12px; }
.sw { width:10px; height:10px; margin-top:4px; }
.you { background:var(--red); } .claude { background:var(--blue); } .check { border:2px solid var(--ochre); }
.t-you { color:var(--red); } .t-claude { color:var(--blue); } .t-check { color:var(--ochre); }
.rule { font-family:var(--mono); font-size:11px; color:var(--dim); }
.st { font-family:var(--mono); font-size:11px; }
.g { display:inline-block; width:15px; height:15px; line-height:13px; text-align:center; font-size:10px; font-weight:700; border:1.5px solid; margin-right:6px; }
.pass { color:var(--green); } .warn { color:var(--ochre); } .fail { color:var(--red); }
.crow { display:flex; align-items:center; padding:6px 0; border-top:1px solid var(--rule); }
.crow .m { margin-left:auto; font-family:var(--mono); font-size:11px; color:var(--dim); }
select, input, textarea { font:inherit; color:var(--ink); background:var(--paper); border:1px solid var(--rule); padding:4px 6px; }
textarea { width:100%; resize:none; }
.strip { height:74px; display:flex; gap:6px; padding:6px 10px; border-top:1px solid var(--rule); background:var(--sheet); }
.th { border:1px solid var(--rule); padding:2px; font-family:var(--mono); font-size:10px; color:var(--dim); position:relative; }
.th canvas { width:80px; height:45px; image-rendering:pixelated; display:block; }
.th.sel { border:2px solid var(--ink); color:var(--ink); } .th.b { border:2px dashed var(--blue); }
.th .dot { position:absolute; top:4px; right:4px; width:7px; height:7px; border-radius:50%; background:var(--blue); }
.th .s { position:absolute; left:4px; top:4px; padding:0 3px; background:var(--sheet); }
.bar { height:32px; display:flex; align-items:center; gap:14px; padding:0 10px; border-top:1px solid var(--rule); font-family:var(--mono); font-size:11px; color:var(--dim); }
.bar .sp { flex:1; }
.btn { border:1px solid var(--rule); padding:2px 8px; color:var(--ink); font-family:system-ui; font-size:12px; }
.btn.on { background:var(--ink); color:var(--paper); }
.slider { display:inline-flex; align-items:center; gap:6px; } .slider i { display:block; width:90px; height:2px; background:var(--rule); position:relative; }
.slider i b { position:absolute; left:38%; top:-5px; width:6px; height:12px; background:var(--ink); }
.swatch { display:inline-block; width:10px; height:10px; vertical-align:-1px; border:1px solid var(--rule); }
.tools { position:absolute; left:12px; top:12px; background:var(--sheet); border:1px solid var(--rule); display:flex; flex-direction:column; }
.tools span { width:34px; height:32px; display:flex; align-items:center; justify-content:center; border-bottom:1px solid var(--rule); color:var(--dim); font-size:15px; }
.tools .on { background:var(--ink); color:var(--paper); }
.seg { position:absolute; top:12px; left:50%; transform:translateX(-50%); display:flex; background:var(--sheet); border:1px solid var(--rule); }
.seg span { padding:3px 12px; color:var(--dim); font-size:12px; } .seg .on { background:var(--ink); color:var(--paper); }
.pop { position:absolute; right:12px; top:52px; width:290px; background:var(--sheet); border:1px solid var(--ink); padding:12px; z-index:2; }
.grid { display:grid; grid-template-columns:repeat(4,1fr); gap:18px; padding:18px; }
.card canvas { width:100%; image-rendering:pixelated; display:block; background:var(--canvas); }
.card .n { font-family:var(--serif); font-size:15px; margin-top:6px; display:flex; justify-content:space-between; align-items:baseline; }
.card .m { font-family:var(--mono); font-size:11px; color:var(--dim); }
.wait { color:var(--blue); }
.filters { display:flex; gap:8px; align-items:center; padding:12px 18px 0; }
.hist .e { padding:7px 0; border-top:1px solid var(--rule); }
.hist .d { font-family:var(--mono); font-size:10px; color:var(--dim); }
.frames { height:76px; display:flex; gap:6px; padding:6px 10px; border-top:1px solid var(--rule); background:var(--sheet); }
.fr { border:1px solid var(--rule); padding:2px; font-family:var(--mono); font-size:10px; color:var(--dim); text-align:center; }
.fr.sel { border:2px solid var(--ink); color:var(--ink); }
.fr canvas { width:46px; height:46px; image-rendering:pixelated; display:block; }
.screen { display:none; } .screen.on { display:block; }
</style>
</head>
<body>
<!-- Static mockup of the M2 viewer, revision 2. Screens: #s01 .. #s06; add ,dark for the dark theme. Not production code. -->
<script>
// A small procedural night-harbour scene (native 160x90) used only to make the mockup look real.
const PAL = ['#0b0e1f','#141a33','#1f2a4d','#2c3d6b','#3e5f8a','#5b86a8','#8fb5c9','#f2e6b5','#c9a24a','#5a3a2a','#3a2519','#22160f','#e86a3a','#ffd27a','#101418','#6b7f8c'];
const W = 160, H = 90;
function scene(variant) {
  const px = new Uint8Array(W * H);
  let seed = 7;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    let c = y < 14 ? 0 : y < 28 ? 1 : y < 40 ? 2 : 3;
    if (y >= 52) c = (y + ((x >> 3) & 1)) % 9 === 0 ? 5 : y < 66 ? 3 : 2;
    px[y * W + x] = c;
  }
  for (let i = 0; i < 40; i++) { const x = (rnd() * W) | 0, y = (rnd() * 38) | 0; px[y * W + x] = 6; }
  const mx = 120, my = 16;
  for (let y = -6; y <= 6; y++) for (let x = -6; x <= 6; x++) if (x * x + y * y <= 36) px[(my + y) * W + mx + x] = x + y > 4 ? 8 : 7;
  for (let y = 54; y < 66; y += 2) for (let x = 114; x < 127; x++) if (rnd() > 0.45) px[y * W + x] = 6;
  const hills = [[0, 42], [30, 38], [60, 44], [95, 40], [160, 45]];
  for (let x = 0; x < W; x++) {
    let k = 0; while (hills[k + 1][0] < x) k++;
    const [x0, y0] = hills[k], [x1, y1] = hills[k + 1];
    const top = Math.round(y0 + (y1 - y0) * (x - x0) / (x1 - x0));
    for (let y = top; y < 52; y++) px[y * W + x] = 14;
  }
  const houses = [[8, 30, 18], [28, 26, 14], [44, 33, 20], [66, 28, 12]];
  for (const [hx, hy, hw] of houses) {
    for (let y = hy; y < 52; y++) for (let x = hx; x < hx + hw; x++) px[y * W + x] = y < hy + 2 ? 11 : 10;
    for (let wy = hy + 5; wy < 48; wy += 6) for (let wx = hx + 3; wx < hx + hw - 3; wx += 5) {
      px[wy * W + wx] = 13; px[wy * W + wx + 1] = 13; px[(wy + 1) * W + wx] = 12; px[(wy + 1) * W + wx + 1] = 13;
    }
  }
  for (let y = 50; y < 54; y++) for (let x = 0; x < 92; x++) px[y * W + x] = y === 50 ? 8 : 9;
  for (let x = 4; x < 92; x += 11) for (let y = 54; y < 62; y++) { px[y * W + x] = 11; px[y * W + x + 1] = 10; }
  for (let y = 36; y < 50; y++) px[y * W + 84] = 14;
  for (let y = 33; y < 37; y++) for (let x = 82; x < 87; x++) px[y * W + x] = 13;
  const rings = variant >= 4 ? 4 : 2;
  for (let r = rings; r >= 1; r--) for (let y = -r * 3; y <= r * 3; y++) for (let x = -r * 3; x <= r * 3; x++) {
    const d = x * x + y * y, xx = 84 + x, yy = 35 + y;
    if (d <= 9 * r * r && d > 9 * (r - 1) * (r - 1) && xx >= 0 && yy >= 0 && yy < 50 && px[yy * W + xx] <= 3) px[yy * W + xx] = r === 1 ? 4 : 3;
  }
  if (variant >= 4) for (const [x, y] of [[61, 53], [67, 52], [74, 53], [79, 55]]) px[y * W + x] = 12;
  if (variant <= 2) for (let i = 0; i < 120; i++) { const x = (rnd() * W) | 0, y = (rnd() * 36) | 0; px[y * W + x] = 3; }
  return px;
}
function hex(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
const RGB = PAL.map(hex);
function draw(canvas, px, scale, opts = {}) {
  canvas.width = W * scale; canvas.height = H * scale;
  const g = canvas.getContext('2d'); g.imageSmoothingEnabled = false;
  const img = g.createImageData(W, H);
  for (let i = 0; i < W * H; i++) {
    let [r, gg, b] = RGB[px[i]];
    if (opts.mode === 'gray') { const l = 0.3 * r + 0.59 * gg + 0.11 * b; r = gg = b = l; }
    if (opts.dim) { r *= 0.55; gg *= 0.55; b *= 0.55; }
    img.data.set([r, gg, b, 255], i * 4);
  }
  const off = document.createElement('canvas'); off.width = W; off.height = H; off.getContext('2d').putImageData(img, 0, 0);
  g.drawImage(off, 0, 0, W * scale, H * scale);
  if (opts.grid && scale >= 4) {
    g.strokeStyle = 'rgba(0,0,0,0.25)'; g.lineWidth = 1; g.beginPath();
    for (let x = 0; x <= W; x++) { g.moveTo(x * scale + .5, 0); g.lineTo(x * scale + .5, H * scale); }
    for (let y = 0; y <= H; y++) { g.moveTo(0, y * scale + .5); g.lineTo(W * scale, y * scale + .5); }
    g.stroke();
  }
  return g;
}
function box(g, s, x, y, w, h, color, fill) {
  g.lineWidth = 2; g.strokeStyle = color; g.strokeRect(x * s, y * s, w * s, h * s);
  if (fill) { g.fillStyle = fill; g.fillRect(x * s, y * s, w * s, h * s); }
}
function hero(c, f, s, onion) {
  const w = 24, h = 24; c.width = w * s; c.height = h * s;
  const g = c.getContext('2d'); g.fillStyle = '#2c3d6b'; g.fillRect(0, 0, w * s, h * s);
  const leg = [0, 2, 3, 2, 0, -2][f], body = (f % 3 === 1) ? -1 : 0;
  const parts = [[9, 3 + body, 6, 6, '#e8b48a'], [8, 2 + body, 8, 2, '#5a3a2a'], [8, 9 + body, 8, 7, '#c9a24a'],
    [10 + leg, 16, 2, 6, '#3a2519'], [12 - leg, 16, 2, 6, '#22160f'], [7, 10 + body, 2, 5, '#e8b48a']];
  if (onion) { g.globalAlpha = 0.3; for (const [x, y, ww, hh, col] of onion) { g.fillStyle = col; g.fillRect(x * s, y * s, ww * s, hh * s); } g.globalAlpha = 1; }
  for (const [x, y, ww, hh, col] of parts) { g.fillStyle = col; g.fillRect(x * s, y * s, ww * s, hh * s); }
  g.fillStyle = '#0b0e1f'; g.fillRect(13 * s, (5 + body) * s, s, s);
  return parts;
}

function paint(g, s, cells, color) { g.fillStyle = color; for (const [x, y] of cells) g.fillRect(x * s, y * s, s, s); }
const ORPH = [[59, 51, 5, 4], [65, 50, 5, 4], [72, 51, 9, 6]];
const VERS = [['v0001', 'exp', 1], ['v0002', 'draft', 2], ['v0003', 'approved', 3], ['v0004', 'draft', 4], ['v0005', 'draft', 4]];
const $ = id => document.getElementById(id);

function topBar(mode, opts = {}) {
  const modes = ['Look', 'Compare', 'Mark', 'Play'].map(m =>
    `<span class="${m === mode ? 'on' : ''} ${m === 'Play' && !opts.anim ? 'off' : ''}">${m}</span>`).join('');
  return `<div class="top"><div class="l"><span class="ib b" title="All assets (Esc)">←</span>
    <span class="name">${opts.name || 'bg-harbour-night'}</span><span class="meta">${opts.meta || 'background · 320×180 · palette harbour-32'}</span></div>
    <div class="modes">${modes}</div>
    <div class="r"><span class="ib" title="Undo (Ctrl+Z)">↶</span><span class="ib" title="Redo">↷</span>
    <span class="stamp no" title="Reject (R)">Reject</span><span class="stamp ok" title="Approve (A)">Approve</span>
    <span class="ib" title="Theme: follows the system">◐</span></div></div>`;
}
function strip(sel, b) {
  return `<div class="strip">${VERS.map(([v, st, n], i) => `<div class="th ${i === sel ? 'sel' : ''} ${i === b ? 'b' : ''}" title="${v} · ${st}">
    <canvas data-v="${n}"></canvas>${v}${i === 4 ? '<span class="dot" title="New from Claude, not seen yet"></span>' : ''}
    ${st === 'approved' ? '<span class="s pass">✓</span>' : ''}</div>`).join('')}</div>`;
}
function bar(left, opts = {}) {
  return `<div class="bar">${left}<span class="sp"></span>
    <select title="View (V)"><option>${opts.view || 'Color'}</option></select>
    <span class="btn ${opts.grid === false ? '' : 'on'}" title="Pixel grid (G)">Grid</span>
    <span class="slider" title="Zoom (1-6, Ctrl+wheel)">−<i><b></b></i>+ ${opts.zoom || '4×'}</span>
    <span class="ib" title="Hide the panel (Tab)">▤</span></div>`;
}
const ISSUES = [
  ['claude', 'Dock edge orphans', 'R-PIX-3 orphans', 'open', 'Three 1-px clusters on the pier edge. Fix: clean inside the mask.'],
  ['you', 'Lamp glow banding', 'R-PIX-5 banding', 'open', 'Merge the four steps into two.'],
  ['check', 'orphans · 3 regions', 'R-PIX-3', 'open', '0.8 per tile, max 0.5'],
  ['claude', 'Sky value steps', 'R-VAL-1', 'fixed in v0004', '']];
function issues(sel, form) {
  return `<div class="tabs"><span class="on">Issues<span class="n">3</span></span><span>Checks<span class="n">2!</span></span><span>History</span></div>
  <div class="pane">${form || `<div class="verdict"><div class="cap t-claude">Claude · v0004 vs v0003</div>Better value structure; more noise on the dock and around the lamp.</div>`}
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><span class="cap" style="margin:0">On this version</span><select><option>All</option></select></div>
  ${ISSUES.map(([who, t, r, s, n], i) => `<div class="issue ${i === sel ? 'sel' : ''}"><span class="sw ${who}"></span>
    <div><div>${t}</div><div class="rule">${r}${n && i === sel ? '' : ''}</div>${n && i === sel ? `<div style="margin-top:4px">${n}</div>` : ''}</div>
    <span class="st ${s === 'open' ? '' : 'pass'}">${s === 'open' ? '' : '✓ ' + s.replace('fixed in ', '')}</span></div>`).join('')}
  </div>`;
}
const CHECKS = [['palette', 'pass', '1.00 · 24/32'], ['grid', 'pass', 'clean'], ['value-groups', 'pass', 'k=4'], ['orphans', 'warn', '0.8/tile'],
  ['line-runs', 'pass', '0'], ['banding', 'warn', '18 px'], ['pillow', 'pass', '0.71'], ['ramps', 'pass', '4 ok'], ['focal-contrast', 'pass', '2.1×']];
const GL = { pass: '✓', warn: '!', fail: '✕' };
function checks(delta) {
  const D = { 'orphans': ['0.2', 'pass'], 'banding': ['0', 'pass'], 'focal-contrast': ['1.7×', 'pass'] };
  return `<div class="tabs"><span>Issues<span class="n">3</span></span><span class="on">Checks<span class="n">2!</span></span><span>History</span></div>
  <div class="pane">${delta ? '<div class="cap">A v0003 → B v0004</div>' : '<div class="cap">report.json · v0004</div>'}
  ${CHECKS.map(([n, s, m]) => `<div class="crow"><span class="g ${s}">${GL[s]}</span>${n}<span class="m">${delta && D[n] ? `${D[n][0]} → ` : ''}${m}</span></div>`).join('')}
  ${delta ? `<div class="cap" style="margin-top:14px">Difference</div>
  <div class="crow">changed pixels<span class="m">214 · 0.37%</span></div><div class="crow">colors used<span class="m">23 → 24</span></div>
  <div class="crow">area<span class="m">58,40 – 141,79</span></div>` : ''}</div>`;
}
function history() {
  return `<div class="tabs"><span>Issues<span class="n">3</span></span><span>Checks<span class="n">2!</span></span><span class="on">History</span></div>
  <div class="pane hist"><div class="cap">bg-harbour-night · newest first</div>
  <div class="e"><span class="t-claude">Claude</span> made v0005 from v0004: clean inside “dock-orphans”<div class="d">13:12 · not reviewed</div></div>
  <div class="e"><span class="t-check">check</span> v0004: 2 warnings<div class="d">13:02 · orphans 0.8/tile · banding 18 px</div></div>
  <div class="e"><span class="t-claude">Claude</span> critique of v0004 vs v0003<div class="d">13:02 · 2 issues</div></div>
  <div class="e"><span class="t-you">You</span> <span class="pass">approved</span> v0003 “good base, keep palette”<div class="d">12:40 · palette 1.00 · k=4</div></div>
  <div class="e"><span class="t-you">You</span> <span class="fail">rejected</span> v0002 “sky too busy”<div class="d">12:31 · k=7</div></div>
  <div class="e"><span class="t-claude">Claude</span> made v0001 (experiment)<div class="d">12:05 · snap + quantize</div></div></div>`;
}
function asset(mode, centre, side, foot, opts = {}) {
  return `<div class="app">${topBar(mode, opts)}<div class="body"><div class="work">
    <div class="canvas">${centre}</div>${foot}</div><div class="side">${side}</div></div></div>`;
}
const PIX = '<span>x 112 y 41</span><span><span class="swatch" style="background:#3e5f8a"></span> 9 #3e5f8a water-2</span><span>v0004 · draft · from v0003</span>';

const SCREENS = {
  s01() {
    const A = [['bg-harbour-night', 'background', 'v0005', 'new from Claude', 1], ['bg-tavern-inside', 'background', 'v0007', 'approved', 3],
      ['bg-lighthouse', 'background', 'v0002', '1 failing check', 2], ['bg-market-day', 'background', 'v0011', 'final', 4],
      ['chr-hero', 'sprite', 'v0003', 'waiting for you', 4], ['prop-lantern', 'prop', 'v0002', 'approved', 3],
      ['prop-crate', 'prop', 'v0001', 'waiting for you', 2], ['bg-cliff-road', 'background', 'v0005', 'Claude is working', 1]];
    return `<div class="app"><div class="top"><div class="l"><span class="name">art-workspace</span><span class="meta">style v3 · 8 assets</span></div><div></div>
      <div class="r"><span class="ib" title="Live: updated 4 s ago">●</span><span class="ib" title="Theme">◐</span></div></div>
      <div class="filters"><input placeholder="Find an asset" style="width:220px"><select><option>Drafts, approved, final</option></select>
      <select><option>All kinds</option></select><select><option>Any status</option></select><span style="flex:1"></span><span class="meta">sorted by</span><select><option>Last change</option></select></div>
      <div class="grid">${A.map(([id, k, v, s, n]) => `<div class="card"><canvas data-v="${n}"></canvas>
        <div class="n"><span>${id}</span><span class="meta">${v}</span></div>
        <div class="m">${k} · <span class="${/waiting|new/.test(s) ? 'wait' : /fail/.test(s) ? 'fail' : /approved|final/.test(s) ? 'pass' : ''}">${s}</span></div></div>`).join('')}</div></div>`;
  },
  s02: () => asset('Look', '<canvas id="c"></canvas>', issues(0), strip(3) + bar(PIX)),
  s03: () => asset('Compare', `<div class="seg"><span class="on">Side by side</span><span>Onion</span><span>Swipe</span><span>Difference</span></div>
      <canvas id="ca"></canvas><canvas id="cb"></canvas><span class="tag" style="left:12px;bottom:12px">A v0003 approved</span><span class="tag" style="right:12px;bottom:12px">B v0004</span>`,
    checks(true), strip(3, 2) + bar('<span>x 70 y 60</span><span>A 4 · B 9</span><span title="Click a version for B, shift-click for A">A v0003 · B v0004</span>', { zoom: '2×', grid: false })),
  s04: () => asset('Mark', `<div class="tools"><span class="on" title="Brush (B)">✎</span><span title="Rectangle (M)">▭</span><span title="Fill same color (F)">◧</span><span title="Erase (E)">⌫</span><span style="font-size:11px;font-family:var(--mono)" title="Brush size ([ ])">2px</span></div><canvas id="c"></canvas>`,
    issues(1, `<div class="cap t-you">New issue · 37 px marked</div><select style="width:100%"><option>R-PIX-5 banding</option></select>
      <textarea rows="2" style="margin-top:6px">Lamp glow banding; merge into two steps.</textarea>
      <div style="display:flex;gap:8px;margin:6px 0 14px"><span class="btn on">Save issue</span><span class="btn">Discard</span></div>`),
    strip(3) + bar('<span>x 84 y 35</span><span>marking on v0004</span>')),
  s05: () => asset('Look', '<canvas id="c"></canvas>' + `<div class="pop"><div class="cap t-you" style="color:var(--red)">Reject v0004</div>
      <textarea rows="3" placeholder="Why? (needed)">Dock reads noisy at 1×; keep v0003 sky.</textarea>
      <div class="meta" style="margin:6px 0 10px">Saved to the history with the check results.</div>
      <div style="display:flex;gap:8px"><span class="stamp no">Reject</span><span class="btn">Cancel</span></div></div>`,
    history(), strip(3) + bar(PIX)),
  s06: () => asset('Play', '<canvas id="hero"></canvas><span class="tag" style="left:12px;bottom:12px">frame 3/6 · 100 ms</span>',
    `<div class="tabs"><span class="on">Issues<span class="n">0</span></span><span>Checks</span><span>History</span></div><div class="pane"><div class="cap">Animation</div>
      <div class="crow">tag<span class="m"><select><option>walk-side</option></select></span></div>
      <div class="crow">speed<span class="m"><select><option>file timing</option></select></span></div>
      <div class="crow">loop<span class="m">on</span></div><div class="crow">onion skin<span class="m">previous frame</span></div>
      <div class="cap" style="margin-top:14px">Issues on this version</div><div class="meta">None open.</div></div>`,
    `<div class="frames">${[100, 100, 100, 120, 100, 100].map((ms, i) => `<div class="fr ${i === 2 ? 'sel' : ''}"><canvas data-f="${i}"></canvas>${ms}</div>`).join('')}</div>`
    + bar('<span class="btn on" title="Play (Space)">▶</span><span class="btn" title="Previous frame (,)">◀</span><span class="btn" title="Next frame (.)">▶|</span>', { zoom: '16×', grid: false }),
    { name: 'chr-hero', meta: 'sprite · 24×24 · 6 frames', anim: true }),
};

function render() {
  const [id, theme] = (location.hash.slice(1) || 's01').split(',');
  document.documentElement.dataset.theme = theme || 'light';
  document.body.innerHTML = SCREENS[id]();
  document.querySelectorAll('canvas[data-v]').forEach(c => draw(c, scene(+c.dataset.v), 1));
  document.querySelectorAll('canvas[data-f]').forEach(c => hero(c, +c.dataset.f, 2));
  if ($('c')) {
    const g = draw($('c'), scene(4), 4, { grid: true });
    if (id === 's02') { for (const r of ORPH) box(g, 4, ...r, '#2f5f9e', 'rgba(47,95,158,0.18)'); }
    if (id === 's04') {
      const lamp = []; for (let y = 26; y < 45; y++) for (let x = 75; x < 94; x++) { const d = (x - 84) ** 2 + (y - 35) ** 2; if (d < 70 && d > 20) lamp.push([x, y]); }
      paint(g, 4, lamp, 'rgba(194,56,31,0.5)'); for (const r of ORPH) box(g, 4, ...r, 'rgba(47,95,158,0.9)');
    }
  }
  if ($('ca')) { draw($('ca'), scene(3), 2); draw($('cb'), scene(4), 2); }
  if ($('hero')) { const prev = hero(document.createElement('canvas'), 1, 1); hero($('hero'), 2, 16, prev); }
}
render();
</script>
</body>
</html>
