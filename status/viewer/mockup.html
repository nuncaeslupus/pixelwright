<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>pw view mockup r3</title>
<!-- The real viewer ships these OFL fonts inside the package (works offline); the mockup loads them from Google Fonts. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600&family=Atkinson+Hyperlegible+Mono:wght@400;500&display=swap">
<style>
/* Soft chrome, pixels only in the image. Light: cool mineral gray. Dark: soft graphite. Canvas always neutral gray. */

  --you:#e4572e; --claude:#178f86; --check:#c98a0b; --ok:#2f8f4e; --canvas:#7a7a7a; --shadow:0 1px 2px rgba(20,30,40,.06),0 4px 14px rgba(20,30,40,.07);

  --you:#ff7f5c; --claude:#3cc1b5; --check:#e7ad3c; --ok:#5cc07c; --canvas:#5c5c5c; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.3); }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.45 var(--sans); }
svg.i { width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
.app { height:800px; display:flex; flex-direction:column; }
.top { height:52px; display:grid; grid-template-columns:1fr auto 1fr; align-items:center; padding:0 12px; }
.top .l, .top .r { display:flex; align-items:center; gap:8px; } .top .r { justify-content:flex-end; }
.name { font-weight:600; font-size:16px; margin-left:4px; }
.meta { color:var(--dim); font-size:12.5px; }
.mono { font-family:var(--mono); }
.modes { display:flex; gap:2px; background:var(--soft); padding:3px; border-radius:10px; }
.modes span { padding:5px 16px; color:var(--dim); border-radius:8px; }
.modes .on { background:var(--panel); color:var(--ink); box-shadow:var(--shadow); font-weight:600; }
.modes .off { opacity:.4; }
.ib { position:relative; width:34px; height:34px; display:inline-flex; align-items:center; justify-content:center; border-radius:9px; color:var(--dim); }
.ib:hover, .ib.h { background:var(--hover); color:var(--ink); }

.pill.ok { background:var(--ok); color:#fff; } .pill.no { color:var(--you); box-shadow:inset 0 0 0 1.5px var(--you); }
.pill.q { background:var(--soft); color:var(--ink); }
.body { flex:1; display:flex; min-height:0; gap:10px; padding:0 10px 10px; }

.canvas canvas { image-rendering:pixelated; }
.tag { position:absolute; font-size:12px; background:var(--panel); color:var(--ink); padding:3px 10px; border-radius:12px; box-shadow:var(--shadow); }
.side { width:318px; background:var(--panel); border-radius:14px; box-shadow:var(--shadow); display:flex; flex-direction:column; overflow:hidden; }
.tabs { display:flex; gap:4px; padding:10px 10px 0; }
.tabs span { padding:6px 12px; color:var(--dim); border-radius:8px; }
.tabs .on { background:var(--soft); color:var(--ink); font-weight:600; }
.tabs .n { font-size:11px; margin-left:5px; padding:0 6px; border-radius:8px; background:var(--line); color:var(--ink); }
.tabs .n.w { background:var(--check); color:#fff; }
.pane { padding:12px 14px; overflow:hidden; flex:1; }
.cap { font-size:12px; color:var(--dim); margin:2px 0 8px; font-weight:600; }

.av { width:18px; height:18px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; color:#fff; font-size:10px; font-weight:700; }
.a-you { background:var(--you); } .a-claude { background:var(--claude); } .a-check { background:var(--check); }
.t-you { color:var(--you); } .t-claude { color:var(--claude); } .t-check { color:var(--check); }

.issue.sel { background:var(--hover); }
.rule { font-size:12px; color:var(--dim); }
.done { font-size:12px; color:var(--ok); }
.st { width:20px; height:20px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; color:#fff; margin-right:10px; }
.st svg { width:12px; height:12px; stroke-width:2.6; }
.pass { background:var(--ok); } .warn { background:var(--check); } .fail { background:var(--you); }
.crow { display:flex; align-items:center; padding:7px 4px; }
.crow + .crow { border-top:1px solid var(--line); }
.crow .m { margin-left:auto; font-family:var(--mono); font-size:12px; color:var(--dim); }
select, input, textarea { font:inherit; font-size:13.5px; color:var(--ink); background:var(--soft); border:1px solid transparent; border-radius:9px; padding:6px 10px; }
textarea { width:100%; resize:none; }
.strip { height:78px; display:flex; gap:8px; padding:8px 12px; background:var(--panel); }
.th { border-radius:8px; padding:3px; font-size:11px; color:var(--dim); position:relative; text-align:center; }
.th canvas { width:84px; height:47px; image-rendering:pixelated; display:block; border-radius:5px; }
.th.sel { background:var(--soft); color:var(--ink); box-shadow:inset 0 0 0 2px var(--ink); } .th.b { box-shadow:inset 0 0 0 2px var(--claude); }
.th .dot { position:absolute; top:7px; right:7px; width:8px; height:8px; border-radius:50%; background:var(--claude); box-shadow:0 0 0 2px var(--panel); }
.th .ok { position:absolute; left:7px; top:7px; width:15px; height:15px; border-radius:50%; background:var(--ok); color:#fff; display:flex; align-items:center; justify-content:center; }
.th .ok svg { width:10px; height:10px; stroke-width:3; }
.bar { height:44px; display:flex; align-items:center; gap:10px; padding:0 12px; border-top:1px solid var(--line); font-size:12.5px; color:var(--dim); }
.bar .sp { flex:1; }
.chip { padding:5px 10px; border-radius:8px; background:var(--soft); color:var(--ink); display:inline-flex; align-items:center; gap:6px; }
.chip.on { background:var(--ink); color:var(--panel); }
.slider { display:inline-flex; align-items:center; gap:8px; color:var(--ink); }
.slider i { display:block; width:90px; height:4px; border-radius:2px; background:var(--line); position:relative; }
.slider i b { position:absolute; left:0; width:40%; height:4px; border-radius:2px; background:var(--ink); }
.slider i u { position:absolute; left:calc(40% - 7px); top:-5px; width:14px; height:14px; border-radius:50%; background:var(--panel); box-shadow:0 0 0 2px var(--ink); }
.swatch { display:inline-block; width:12px; height:12px; border-radius:3px; vertical-align:-2px; }
.tools { position:absolute; left:14px; top:14px; background:var(--panel); border-radius:12px; box-shadow:var(--shadow); padding:5px; display:flex; flex-direction:column; gap:2px; }
.tools .ib.on { background:var(--ink); color:var(--panel); }
.seg { position:absolute; top:14px; left:50%; transform:translateX(-50%); display:flex; gap:2px; background:var(--panel); border-radius:10px; padding:3px; box-shadow:var(--shadow); }
.seg span { padding:4px 12px; color:var(--dim); font-size:13px; border-radius:8px; } .seg .on { background:var(--ink); color:var(--panel); }
.pop { position:absolute; right:16px; top:14px; width:300px; background:var(--panel); border-radius:14px; box-shadow:var(--shadow),0 12px 40px rgba(0,0,0,.18); padding:16px; z-index:2; }
.btn { padding:6px 14px; border-radius:9px; background:var(--soft); font-weight:600; font-size:13px; }
.btn.pri { background:var(--ink); color:var(--panel); }
.grid { display:grid; grid-template-columns:repeat(4,1fr); gap:16px; padding:6px 22px 22px; }
.card { background:var(--panel); border-radius:14px; box-shadow:var(--shadow); padding:8px 8px 12px; }
.card canvas { width:100%; image-rendering:pixelated; display:block; border-radius:9px; background:var(--canvas); }
.card .n { font-weight:600; margin:8px 4px 2px; display:flex; justify-content:space-between; align-items:baseline; }
.card .m { font-size:12.5px; color:var(--dim); margin:0 4px; display:flex; align-items:center; gap:6px; }
.badge { font-size:12px; padding:1px 8px; border-radius:10px; background:var(--soft); color:var(--ink); }
.badge.wait { background:color-mix(in srgb, var(--claude) 15%, transparent); color:var(--claude); }
.badge.bad { background:color-mix(in srgb, var(--you) 15%, transparent); color:var(--you); }
.badge.good { background:color-mix(in srgb, var(--ok) 15%, transparent); color:var(--ok); }
.filters { display:flex; gap:8px; align-items:center; padding:4px 22px 12px; }
.hist .e { display:grid; grid-template-columns:22px 1fr; gap:8px; padding:8px 4px; }
.hist .d { font-size:12px; color:var(--dim); }
.frames { height:84px; display:flex; gap:8px; padding:8px 12px; background:var(--panel); }
.fr { border-radius:8px; padding:3px; font-size:11px; color:var(--dim); text-align:center; }
.fr.sel { background:var(--soft); color:var(--ink); box-shadow:inset 0 0 0 2px var(--ink); }
.fr canvas { width:50px; height:50px; image-rendering:pixelated; display:block; border-radius:5px; }
</style>
</head>
<body>
<!-- Static mockup of the M2 viewer, revision 3. Screens: #s01 .. #s06; add ,dark for the dark theme. Not production code. -->
<script>
// A small procedural night-harbour scene (native 160x90) used only to make the mockup look real.
const PAL = ['#0b0e1f','#141a33','#1f2a4d','#2c3d6b','#3e5f8a','#5b86a8','#8fb5c9','#f2e6b5','#c9a24a','#5a3a2a','#3a2519','#22160f','#e86a3a','#ffd27a','#101418','#6b7f8c'];
const W = 160, H = 90;
function scene(variant) {
  const px = new Uint8Array(W * H);
  let seed = 7;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    let c = y < 14 ? 0 : y < 28 ? 1 : y < 40 ? 2 : 3;
    if (y >= 52) c = (y + ((x >> 3) & 1)) % 9 === 0 ? 5 : y < 66 ? 3 : 2;
    px[y * W + x] = c;
  }
  for (let i = 0; i < 40; i++) { const x = (rnd() * W) | 0, y = (rnd() * 38) | 0; px[y * W + x] = 6; }
  const mx = 120, my = 16;
  for (let y = -6; y <= 6; y++) for (let x = -6; x <= 6; x++) if (x * x + y * y <= 36) px[(my + y) * W + mx + x] = x + y > 4 ? 8 : 7;
  for (let y = 54; y < 66; y += 2) for (let x = 114; x < 127; x++) if (rnd() > 0.45) px[y * W + x] = 6;
  const hills = [[0, 42], [30, 38], [60, 44], [95, 40], [160, 45]];
  for (let x = 0; x < W; x++) {
    let k = 0; while (hills[k + 1][0] < x) k++;
    const [x0, y0] = hills[k], [x1, y1] = hills[k + 1];
    const top = Math.round(y0 + (y1 - y0) * (x - x0) / (x1 - x0));
    for (let y = top; y < 52; y++) px[y * W + x] = 14;
  }
  const houses = [[8, 30, 18], [28, 26, 14], [44, 33, 20], [66, 28, 12]];
  for (const [hx, hy, hw] of houses) {
    for (let y = hy; y < 52; y++) for (let x = hx; x < hx + hw; x++) px[y * W + x] = y < hy + 2 ? 11 : 10;
    for (let wy = hy + 5; wy < 48; wy += 6) for (let wx = hx + 3; wx < hx + hw - 3; wx += 5) {
      px[wy * W + wx] = 13; px[wy * W + wx + 1] = 13; px[(wy + 1) * W + wx] = 12; px[(wy + 1) * W + wx + 1] = 13;
    }
  }
  for (let y = 50; y < 54; y++) for (let x = 0; x < 92; x++) px[y * W + x] = y === 50 ? 8 : 9;
  for (let x = 4; x < 92; x += 11) for (let y = 54; y < 62; y++) { px[y * W + x] = 11; px[y * W + x + 1] = 10; }
  for (let y = 36; y < 50; y++) px[y * W + 84] = 14;
  for (let y = 33; y < 37; y++) for (let x = 82; x < 87; x++) px[y * W + x] = 13;
  const rings = variant >= 4 ? 4 : 2;
  for (let r = rings; r >= 1; r--) for (let y = -r * 3; y <= r * 3; y++) for (let x = -r * 3; x <= r * 3; x++) {
    const d = x * x + y * y, xx = 84 + x, yy = 35 + y;
    if (d <= 9 * r * r && d > 9 * (r - 1) * (r - 1) && xx >= 0 && yy >= 0 && yy < 50 && px[yy * W + xx] <= 3) px[yy * W + xx] = r === 1 ? 4 : 3;
  }
  if (variant >= 4) for (const [x, y] of [[61, 53], [67, 52], [74, 53], [79, 55]]) px[y * W + x] = 12;
  if (variant <= 2) for (let i = 0; i < 120; i++) { const x = (rnd() * W) | 0, y = (rnd() * 36) | 0; px[y * W + x] = 3; }
  return px;
}
function hex(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
const RGB = PAL.map(hex);
function draw(canvas, px, scale, opts = {}) {
  canvas.width = W * scale; canvas.height = H * scale;
  const g = canvas.getContext('2d'); g.imageSmoothingEnabled = false;
  const img = g.createImageData(W, H);
  for (let i = 0; i < W * H; i++) {
    let [r, gg, b] = RGB[px[i]];
    if (opts.mode === 'gray') { const l = 0.3 * r + 0.59 * gg + 0.11 * b; r = gg = b = l; }
    if (opts.dim) { r *= 0.55; gg *= 0.55; b *= 0.55; }
    img.data.set([r, gg, b, 255], i * 4);
  }
  const off = document.createElement('canvas'); off.width = W; off.height = H; off.getContext('2d').putImageData(img, 0, 0);
  g.drawImage(off, 0, 0, W * scale, H * scale);
  if (opts.grid && scale >= 4) {
    g.strokeStyle = 'rgba(0,0,0,0.25)'; g.lineWidth = 1; g.beginPath();
    for (let x = 0; x <= W; x++) { g.moveTo(x * scale + .5, 0); g.lineTo(x * scale + .5, H * scale); }
    for (let y = 0; y <= H; y++) { g.moveTo(0, y * scale + .5); g.lineTo(W * scale, y * scale + .5); }
    g.stroke();
  }
  return g;
}
function box(g, s, x, y, w, h, color, fill) {
  g.lineWidth = 2; g.strokeStyle = color; g.strokeRect(x * s, y * s, w * s, h * s);
  if (fill) { g.fillStyle = fill; g.fillRect(x * s, y * s, w * s, h * s); }
}
function hero(c, f, s, onion) {
  const w = 24, h = 24; c.width = w * s; c.height = h * s;
  const g = c.getContext('2d'); g.fillStyle = '#2c3d6b'; g.fillRect(0, 0, w * s, h * s);
  const leg = [0, 2, 3, 2, 0, -2][f], body = (f % 3 === 1) ? -1 : 0;
  const parts = [[9, 3 + body, 6, 6, '#e8b48a'], [8, 2 + body, 8, 2, '#5a3a2a'], [8, 9 + body, 8, 7, '#c9a24a'],
    [10 + leg, 16, 2, 6, '#3a2519'], [12 - leg, 16, 2, 6, '#22160f'], [7, 10 + body, 2, 5, '#e8b48a']];
  if (onion) { g.globalAlpha = 0.3; for (const [x, y, ww, hh, col] of onion) { g.fillStyle = col; g.fillRect(x * s, y * s, ww * s, hh * s); } g.globalAlpha = 1; }
  for (const [x, y, ww, hh, col] of parts) { g.fillStyle = col; g.fillRect(x * s, y * s, ww * s, hh * s); }
  g.fillStyle = '#0b0e1f'; g.fillRect(13 * s, (5 + body) * s, s, s);
  return parts;
}

function paint(g, s, cells, color) { g.fillStyle = color; for (const [x, y] of cells) g.fillRect(x * s, y * s, s, s); }
const ORPH = [[59, 51, 5, 4], [65, 50, 5, 4], [72, 51, 9, 6]];
const VERS = [['v0001', 'experiment', 1], ['v0002', 'draft', 2], ['v0003', 'approved', 3], ['v0004', 'draft', 4], ['v0005', 'draft', 4]];
const $ = id => document.getElementById(id);
const P = {
  menu: 'M4 6h16M4 12h16M4 18h16', back: 'M15 5l-7 7 7 7', undo: 'M9 14L4 9l5-5M4 9h10a6 6 0 010 12h-3', redo: 'M15 14l5-5-5-5M20 9H10a6 6 0 000 12h3',
  bell: 'M6 16V11a6 6 0 0112 0v5l2 2H4zM10 21h4', keys: 'M3 7h18v10H3zM7 11h.01M11 11h.01M15 11h.01M8 14h8', theme: 'M12 3a9 9 0 100 18 7 7 0 010-18z',
  panel: 'M3 5h18v14H3zM15 5v14', check: 'M5 12l5 5 9-10', x: 'M6 6l12 12M18 6L6 18', bang: 'M12 5v9M12 19h.01',
  brush: 'M4 20c3 0 4-1 4-3a2 2 0 114 0c0 2-2 3-8 3zM11 15L20 6l-2-2-9 9', rect: 'M4 6h16v12H4z', fill: 'M5 12l7-7 7 7-7 7zM19 15c1 2 2 3 1 4s-3 0-2-2',
  erase: 'M8 20h12M5 15l9-9 5 5-8 8H8z', play: 'M7 5l12 7-12 7z', prev: 'M17 5L8 12l9 7zM6 5v14', next: 'M7 5l9 7-9 7zM18 5v14',
  grid: 'M4 4h16v16H4zM4 10h16M4 15h16M10 4v16M15 4v16', search: 'M11 4a7 7 0 100 14 7 7 0 000-14zM20 20l-4-4',
};
const I = n => `<svg class="i" viewBox="0 0 24 24"><path d="${P[n]}"/></svg>`;
const ib = (n, title, cls = '', extra = '') => `<span class="ib ${cls}" title="${title}">${I(n)}${extra}</span>`;
const AV = { you: 'Y', claude: 'C', check: '!' };
const av = w => `<span class="av a-${w}">${AV[w]}</span>`;

function topBar(mode, opts = {}) {
  const modes = ['Look', 'Compare', 'Mark', 'Play'].map(m =>
    `<span class="${m === mode ? 'on' : ''} ${m === 'Play' && !opts.anim ? 'off' : ''}">${m}</span>`).join('');
  return `<div class="top"><div class="l">${ib('menu', 'Menu (Alt)')}${ib('back', 'All assets (Esc)')}
    <span class="name">${opts.name || 'bg-harbour-night'}</span><span class="meta">${opts.meta || 'background · 320×180 · harbour-32'}</span></div>
    <div class="modes">${modes}</div>
    <div class="r">${ib('undo', 'Undo (Ctrl+Z)')}${ib('redo', 'Redo (Ctrl+Shift+Z)')}<span class="vsep"></span>
    <span class="pill no" title="Reject (R)">Reject</span><span class="pill ok" title="Approve (A)">${I('check')}Approve</span><span class="vsep"></span>
    ${ib('bell', 'Inbox: 1 new version from Claude', '', '<span class="dot"></span>')}${ib('keys', 'Keyboard shortcuts (?)')}${ib('theme', 'Theme: follows the system')}${ib('panel', 'Side panel (Tab)')}</div></div>`;
}
function strip(sel, b) {
  return `<div class="strip">${VERS.map(([v, st, n], i) => `<div class="th ${i === sel ? 'sel' : ''} ${i === b ? 'b' : ''}" title="${v} · ${st}">
    <canvas data-v="${n}"></canvas>${v}${i === 4 ? '<span class="dot" title="New from Claude"></span>' : ''}
    ${st === 'approved' ? `<span class="ok">${I('check')}</span>` : ''}</div>`).join('')}</div>`;
}
function bar(left, opts = {}) {
  return `<div class="bar">${left}<span class="sp"></span>
    <select title="View (V)"><option>${opts.view || 'Color'}</option></select>
    <span class="chip ${opts.grid === false ? '' : 'on'}" title="Pixel grid (G)">${I('grid')}Grid</span>
    <span class="slider" title="Zoom (1-6, Ctrl+wheel)">−<i><b></b><u></u></i>+ <span class="mono">${opts.zoom || '4×'}</span></span></div>`;
}
const ISSUES = [
  ['claude', 'Dock edge orphans', 'R-PIX-3 · orphans', '', 'Three 1-px clusters on the pier edge. Fix: clean inside this mark.'],
  ['you', 'Lamp glow banding', 'R-PIX-5 · banding', '', 'Merge the four steps into two.'],
  ['check', 'Orphans, 3 places', 'R-PIX-3 · 0.8 per tile', '', ''],
  ['claude', 'Sky value steps', 'R-VAL-1', 'fixed in v0004', '']];
const tabs = (on, nI = 3, warn = true) => `<div class="tabs">${['Issues', 'Checks', 'History'].map(t => `<span class="${t === on ? 'on' : ''}">${t}${t === 'Issues' ? `<span class="n">${nI}</span>` : ''}${t === 'Checks' && warn ? '<span class="n w">2</span>' : ''}</span>`).join('')}</div>`;
function issues(sel, form) {
  return `${tabs('Issues')}<div class="pane">${form || `<div class="verdict"><div class="who t-claude">${av('claude')} Claude · v0004 against v0003</div>
    <div style="margin-top:6px">Better value structure; more noise on the dock and around the lamp.</div></div>`}
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px"><span class="cap" style="margin:0">On this version</span><select><option>All</option></select></div>
  ${ISSUES.map(([who, t, r, s, n], i) => `<div class="issue ${i === sel ? 'sel' : ''}">${av(who)}
    <div><div>${t}</div><div class="rule">${r}</div>${n && i === sel ? `<div style="margin-top:4px;font-size:13px">${n}</div>` : ''}</div>
    <span class="done">${s ? '✓ ' + s.replace('fixed in ', '') : ''}</span></div>`).join('')}</div>`;
}
const CHECKS = [['palette', 'pass', '1.00 · 24/32'], ['grid', 'pass', 'clean'], ['value groups', 'pass', 'k=4'], ['orphans', 'warn', '0.8/tile'],
  ['line runs', 'pass', '0'], ['banding', 'warn', '18 px'], ['pillow shading', 'pass', '0.71'], ['ramps', 'pass', '4 ok'], ['focal contrast', 'pass', '2.1×']];
const GL = { pass: 'check', warn: 'bang', fail: 'x' };
function checks(delta) {
  const D = { 'orphans': '0.2 → ', 'banding': '0 → ', 'focal contrast': '1.7× → ' };
  return `${tabs('Checks')}<div class="pane"><div class="cap">${delta ? 'A v0003 → B v0004' : 'v0004'}</div>
  ${CHECKS.map(([n, s, m]) => `<div class="crow"><span class="st ${s}">${I(GL[s])}</span>${n}<span class="m">${delta && D[n] ? D[n] : ''}${m}</span></div>`).join('')}
  ${delta ? `<div class="cap" style="margin-top:16px">Difference</div>
  <div class="crow">changed pixels<span class="m">214 · 0.37%</span></div><div class="crow">colors used<span class="m">23 → 24</span></div>
  <div class="crow">changed area<span class="m">58,40 – 141,79</span></div>` : ''}</div>`;
}
function history() {
  const E = [['claude', 'Made <b>v0005</b> from v0004: cleaned inside “Dock edge orphans”', '13:12 · new'],
    ['check', 'Checked v0004: 2 warnings', '13:02 · orphans 0.8/tile · banding 18 px'],
    ['claude', 'Critique of v0004 against v0003', '13:02 · 2 issues'],
    ['you', '<span style="color:var(--ok)">Approved</span> v0003 “good base, keep the palette”', '12:40 · palette 1.00 · k=4'],
    ['you', '<span style="color:var(--you)">Rejected</span> v0002 “sky too busy”', '12:31 · k=7'],
    ['claude', 'Made v0001 (experiment)', '12:05 · snap + quantize']];
  return `${tabs('History')}<div class="pane hist">${E.map(([w, t, d]) => `<div class="e">${av(w)}<div>${t}<div class="d">${d}</div></div></div>`).join('')}</div>`;
}
function asset(mode, centre, side, foot, opts = {}) {
  return `<div class="app">${topBar(mode, opts)}<div class="body"><div class="work">
    <div class="canvas">${centre}</div>${foot}</div><div class="side">${side}</div></div></div>`;
}
const PIX = '<span class="mono">112, 41</span><span><span class="swatch" style="background:#3e5f8a"></span> <span class="mono">#3e5f8a</span> · index 9 · water-2</span>';

const SCREENS = {
  s01() {
    const A = [['bg-harbour-night', 'background', 'v0005', 'New from Claude', 'wait', 1], ['bg-tavern-inside', 'background', 'v0007', 'Approved', 'good', 3],
      ['bg-lighthouse', 'background', 'v0002', '1 failing check', 'bad', 2], ['bg-market-day', 'background', 'v0011', 'Final', 'good', 4],
      ['chr-hero', 'sprite', 'v0003', 'Waiting for you', 'wait', 4], ['prop-lantern', 'prop', 'v0002', 'Approved', 'good', 3],
      ['prop-crate', 'prop', 'v0001', 'Waiting for you', 'wait', 2], ['bg-cliff-road', 'background', 'v0005', 'Claude is working…', '', 1]];
    return `<div class="app"><div class="top"><div class="l">${ib('menu', 'Menu (Alt)')}<span class="name">art-workspace</span><span class="meta">style v3 · 8 assets</span></div><div></div>
      <div class="r">${ib('bell', 'Inbox: 1 new version from Claude', '', '<span class="dot"></span>')}${ib('keys', 'Keyboard shortcuts (?)')}${ib('theme', 'Theme')}</div></div>
      <div class="filters"><span style="position:relative"><input placeholder="Find an asset" style="width:240px;padding-left:34px"><span style="position:absolute;left:9px;top:6px;color:var(--dim)">${I('search')}</span></span>
      <select><option>Drafts, approved, final</option></select><select><option>All kinds</option></select><select><option>Any status</option></select>
      <span style="flex:1"></span><span class="meta">Sort</span><select><option>Last change</option></select></div>
      <div class="grid">${A.map(([id, k, v, s, c, n]) => `<div class="card"><canvas data-v="${n}"></canvas>
        <div class="n"><span>${id}</span><span class="meta mono">${v}</span></div>
        <div class="m">${k}<span style="flex:1"></span><span class="badge ${c}">${s}</span></div></div>`).join('')}</div></div>`;
  },
  s02: () => asset('Look', '<canvas id="c"></canvas>', issues(0), strip(3) + bar(PIX)),
  s03: () => asset('Compare', `<div class="seg"><span class="on">Side by side</span><span>Onion</span><span>Swipe</span><span>Difference</span></div>
      <canvas id="ca"></canvas><canvas id="cb"></canvas><span class="tag" style="left:14px;bottom:14px">A · v0003 approved</span><span class="tag" style="right:14px;bottom:14px">B · v0004</span>`,
    checks(true), strip(3, 2) + bar('<span class="mono">70, 60</span><span title="Click a version for B, shift-click for A">A v0003 · B v0004</span>', { zoom: '2×', grid: false })),
  s04: () => asset('Mark', `<div class="tools">${ib('brush', 'Brush (B)', 'on')}${ib('rect', 'Rectangle (M)')}${ib('fill', 'Fill the same color (F)')}${ib('erase', 'Erase (E)')}
      <span class="ib mono" style="font-size:12px" title="Brush size ([ and ])">2px</span></div><canvas id="c"></canvas>`,
    issues(1, `<div class="cap" style="color:var(--you)">New issue · 37 pixels marked</div><select style="width:100%"><option>R-PIX-5 · banding</option></select>
      <textarea rows="2" style="margin-top:8px">Lamp glow banding; merge into two steps.</textarea>
      <div style="display:flex;gap:8px;margin:8px 0 16px"><span class="btn pri">Save issue</span><span class="btn">Discard</span></div>`),
    strip(3) + bar('<span class="mono">84, 35</span><span>Marking on v0004</span>')),
  s05: () => asset('Look', '<canvas id="c"></canvas>' + `<div class="pop"><div style="font-weight:600;margin-bottom:8px">Reject v0004?</div>
      <textarea rows="3" placeholder="Why? (needed)">Dock reads noisy at 1×; keep the v0003 sky.</textarea>
      <div class="meta" style="margin:8px 0 12px">Saved in History with the check results.</div>
      <div style="display:flex;gap:8px;justify-content:flex-end"><span class="btn">Cancel</span><span class="pill no">Reject</span></div></div>`,
    history(), strip(3) + bar(PIX)),
  s06: () => asset('Play', '<canvas id="hero"></canvas><span class="tag" style="left:14px;bottom:14px">Frame 3 of 6 · 100 ms</span>',
    `${tabs('Issues', 0, false)}<div class="pane"><div class="cap">Playback</div>
      <div class="crow">Tag<span class="m"><select><option>walk-side</option></select></span></div>
      <div class="crow">Speed<span class="m"><select><option>File timing</option></select></span></div>
      <div class="crow">Loop<span class="m">On</span></div><div class="crow">Onion skin<span class="m">Previous frame</span></div>
      <div class="cap" style="margin-top:16px">Issues on this version</div><div class="meta">None open.</div></div>`,
    `<div class="frames">${[100, 100, 100, 120, 100, 100].map((ms, i) => `<div class="fr ${i === 2 ? 'sel' : ''}"><canvas data-f="${i}"></canvas>${ms} ms</div>`).join('')}</div>`
    + bar(`${ib('prev', 'Previous frame (,)')}<span class="ib h" title="Play (Space)">${I('play')}</span>${ib('next', 'Next frame (.)')}`, { zoom: '16×', grid: false }),
    { name: 'chr-hero', meta: 'sprite · 24×24 · 6 frames', anim: true }),
};

function render() {
  const [id, theme] = (location.hash.slice(1) || 's01').split(',');
  document.documentElement.dataset.theme = theme || 'light';
  document.body.innerHTML = SCREENS[id]();
  document.querySelectorAll('canvas[data-v]').forEach(c => draw(c, scene(+c.dataset.v), 1));
  document.querySelectorAll('canvas[data-f]').forEach(c => hero(c, +c.dataset.f, 2));
  const css = getComputedStyle(document.documentElement);
  const you = css.getPropertyValue('--you').trim(), cl = css.getPropertyValue('--claude').trim();
  if ($('c')) {
    const g = draw($('c'), scene(4), 4, { grid: true });
    if (id === 's02') { g.setLineDash([6, 4]); for (const r of ORPH) box(g, 4, ...r, cl); }
    if (id === 's04') {
      const lamp = []; for (let y = 26; y < 45; y++) for (let x = 75; x < 94; x++) { const d = (x - 84) ** 2 + (y - 35) ** 2; if (d < 70 && d > 20) lamp.push([x, y]); }
      g.globalAlpha = 0.55; paint(g, 4, lamp, you); g.globalAlpha = 1; g.setLineDash([6, 4]); for (const r of ORPH) box(g, 4, ...r, cl);
    }
  }
  if ($('ca')) { draw($('ca'), scene(3), 2); draw($('cb'), scene(4), 2); }
  if ($('hero')) { const prev = hero(document.createElement('canvas'), 1, 1); hero($('hero'), 2, 16, prev); }
}
render();
</script>
