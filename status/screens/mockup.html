<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>pixelwright app mockup (M4)</title>
<!-- Static mockup for the screens review (T52). The real app ships these OFL fonts in the package. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600&family=Atkinson+Hyperlegible+Mono:wght@400;500&display=swap">
<style>
:root { --bg:#e9ecee; --panel:#fff; --ink:#22262b; --dim:#6c737c; --line:#dde1e5; --soft:#f2f4f6; --hover:#eef1f4;
  --you:#e4572e; --ai:#178f86; --script:#c98a0b; --ok:#2f8f4e; --canvas:#7a7a7a;
  --shadow:0 1px 2px rgba(20,30,40,.06),0 4px 14px rgba(20,30,40,.07);
  --sans:"Atkinson Hyperlegible Next",system-ui,sans-serif; --mono:"Atkinson Hyperlegible Mono",ui-monospace,monospace; }
[data-theme=dark] { --bg:#18191b; --panel:#222427; --ink:#e6e8eb; --dim:#9aa1a9; --line:#33363a; --soft:#2a2c30; --hover:#2d3034;
  --you:#ff7f5c; --ai:#3cc1b5; --script:#e7ad3c; --ok:#5cc07c; --canvas:#5c5c5c; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.3); }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.45 var(--sans); }
.app { height:800px; display:flex; flex-direction:column; position:relative; }
.top { height:56px; display:flex; align-items:center; justify-content:space-between; padding:0 14px; gap:10px; }
.row { display:flex; align-items:center; gap:8px; }
.brand { display:flex; align-items:center; gap:8px; font-weight:600; font-size:15px; }
.logo { width:22px; height:22px; border-radius:6px; background:conic-gradient(var(--you) 0 25%, var(--ai) 0 50%, var(--script) 0 75%, var(--ok) 0); }
.dim { color:var(--dim); } .small { font-size:12.5px; } .mono { font-family:var(--mono); }
.btn { padding:7px 14px; border-radius:10px; background:var(--panel); box-shadow:var(--shadow); font-weight:600; font-size:13.5px; display:inline-flex; align-items:center; gap:6px; white-space:nowrap; }
.btn.flat { background:var(--soft); box-shadow:none; }
.btn.pri { background:var(--ok); color:#fff; }
.btn.ai { background:var(--ai); color:#fff; }
.btn.ghost { background:none; box-shadow:inset 0 0 0 1.5px var(--line); }
.btn.no { background:none; color:var(--you); box-shadow:inset 0 0 0 1.5px var(--you); }
.btn.sm { padding:4px 10px; font-size:12.5px; border-radius:8px; }
.status { display:inline-flex; align-items:center; gap:7px; padding:6px 12px; border-radius:20px; background:var(--soft); font-size:12.5px; }
.led { width:8px; height:8px; border-radius:50%; background:var(--ai); box-shadow:0 0 0 3px color-mix(in srgb,var(--ai) 25%,transparent); }
.led.off { background:var(--dim); box-shadow:none; }
.body { flex:1; display:flex; gap:10px; padding:0 10px 10px; min-height:0; }
.card { background:var(--panel); border-radius:14px; box-shadow:var(--shadow); }
.side { width:230px; padding:12px; display:flex; flex-direction:column; gap:2px; }
.side .h { font-size:12px; font-weight:600; color:var(--dim); margin:6px 6px 4px; }
.navi { display:flex; justify-content:space-between; padding:7px 10px; border-radius:9px; }
.navi.on { background:var(--soft); font-weight:600; }
.navi .n { color:var(--dim); font-size:12px; }
.main { flex:1; padding:16px 18px; overflow:hidden; display:flex; flex-direction:column; gap:14px; }
.grid { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
.asset { border-radius:12px; background:var(--soft); overflow:hidden; display:flex; flex-direction:column; }
.asset.hl { box-shadow:0 0 0 2px var(--ai); }
.thumb { height:118px; background:var(--canvas); display:flex; align-items:center; justify-content:center; }
canvas { image-rendering:pixelated; display:block; }
.asset .info { padding:9px 11px 11px; display:flex; flex-direction:column; gap:5px; }
.chip { font-size:11px; font-weight:600; padding:2px 8px; border-radius:10px; background:var(--line); }
.chip.new { background:var(--line); } .chip.wip { background:color-mix(in srgb,var(--script) 22%,var(--panel)); }
.chip.ok { background:color-mix(in srgb,var(--ok) 22%,var(--panel)); }
.next { font-size:12.5px; display:flex; align-items:center; gap:6px; }
.av { width:18px; height:18px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; color:#fff; font-size:10px; font-weight:700; flex:none; }
.a-you { background:var(--you); } .t-you{color:var(--you)} .t-ai{color:var(--ai)} .t-script{color:var(--script)} .a-ai { background:var(--ai); } .a-script { background:var(--script); }
.drop { border:1.5px dashed var(--line); border-radius:12px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; color:var(--dim); min-height:190px; font-size:13px; }
/* asset screen */
.work { flex:1; display:flex; flex-direction:column; min-width:0; overflow:hidden; }
.cbar { display:flex; justify-content:space-between; align-items:center; padding:10px 12px; }
.seg { display:flex; gap:2px; background:var(--soft); padding:3px; border-radius:10px; }
.seg span { padding:4px 14px; border-radius:8px; color:var(--dim); font-size:13px; }
.seg .on { background:var(--panel); color:var(--ink); font-weight:600; box-shadow:var(--shadow); }
.canvasbox { flex:1; background:var(--canvas); position:relative; display:flex; align-items:center; justify-content:center; gap:24px; }
.mk { position:absolute; width:22px; height:22px; border-radius:50%; color:#fff; font-size:11px; font-weight:700; display:flex; align-items:center; justify-content:center; box-shadow:0 0 0 2px #fff; }
.box { position:absolute; border:2px solid; border-radius:3px; }
.legend { display:inline-flex; align-items:center; gap:6px; color:var(--dim); margin-right:6px; }
.zoom { position:absolute; right:12px; bottom:12px; display:flex; align-items:center; gap:6px; background:var(--panel); padding:4px 6px; border-radius:10px; box-shadow:var(--shadow); }
.hint { position:absolute; left:12px; bottom:12px; color:#fff; opacity:.8; }
.hist { margin-top:auto; padding:10px; border-top:1px solid var(--line); color:var(--dim); }
.lbl { position:absolute; top:10px; font-size:12px; background:var(--panel); padding:2px 10px; border-radius:10px; box-shadow:var(--shadow); }
.strip { display:flex; gap:8px; padding:10px 12px; align-items:flex-end; overflow:hidden; }
.ver { display:flex; flex-direction:column; align-items:center; gap:3px; font-size:11.5px; color:var(--dim); }
.ver .t { width:84px; height:48px; border-radius:6px; background:var(--canvas); overflow:hidden; display:flex; align-items:center; justify-content:center; }
.ver.on .t { box-shadow:0 0 0 2px var(--ink); } .ver.on { color:var(--ink); font-weight:600; }
.ver .by { display:flex; gap:4px; align-items:center; }
.arrow { color:var(--dim); padding-bottom:22px; }
.panel { width:340px; display:flex; flex-direction:column; overflow:hidden; }
.panel .hd { padding:14px 16px 6px; display:flex; justify-content:space-between; align-items:center; }
.list { flex:1; padding:4px 10px; overflow:hidden; display:flex; flex-direction:column; gap:6px; }
.adv { padding:10px; border-radius:10px; display:grid; grid-template-columns:24px 1fr; gap:8px; }
.adv.sel { background:var(--hover); }
.adv .msg { font-size:13.5px; }
.adv .why { font-size:12px; color:var(--dim); }
.adv .acts { display:flex; gap:6px; margin-top:6px; }
.adv.done { opacity:.55; }
.ask { margin:8px 12px 12px; padding:10px; border-radius:12px; background:var(--soft); display:flex; flex-direction:column; gap:8px; }
.field { background:var(--panel); border-radius:9px; padding:8px 10px; color:var(--dim); font-size:13px; box-shadow:inset 0 0 0 1px var(--line); }
.field.txt { color:var(--ink); }
.reject { margin-top:8px; padding:10px; border-radius:10px; background:var(--panel); box-shadow:inset 0 0 0 1.5px var(--you); display:flex; flex-direction:column; gap:8px; font-size:13px; }
.chk { display:flex; align-items:center; gap:7px; font-size:13px; }
.cb { width:16px; height:16px; border-radius:4px; box-shadow:inset 0 0 0 1.5px var(--dim); display:inline-flex; align-items:center; justify-content:center; font-size:11px; }
.cb.on { background:var(--ink); color:var(--panel); box-shadow:none; }
.rad { width:16px; height:16px; border-radius:50%; box-shadow:inset 0 0 0 1.5px var(--dim); }
.rad.on { box-shadow:inset 0 0 0 5px var(--ink); }
.wait { display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--ai); font-weight:600; }
/* start screen */
.center { flex:1; display:flex; align-items:center; justify-content:center; }
.start { width:620px; padding:34px 36px; display:flex; flex-direction:column; gap:18px; }
.choices { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
.choice { background:var(--soft); border-radius:12px; padding:14px; display:flex; flex-direction:column; gap:4px; }
.choice b { font-size:14px; }
.recent { display:flex; justify-content:space-between; padding:8px 10px; border-radius:9px; }
.recent:hover, .recent.h { background:var(--hover); }
/* guide */
.dimmer { position:absolute; inset:0; background:rgba(15,20,25,.38); }
.spot { position:absolute; border-radius:14px; box-shadow:0 0 0 3px #fff, 0 0 0 9999px rgba(15,20,25,.38); }
.coach { position:absolute; width:320px; padding:16px 18px; display:flex; flex-direction:column; gap:10px; }
.dots { display:flex; gap:5px; } .dots i { width:7px; height:7px; border-radius:50%; background:var(--line); } .dots i.on { background:var(--ink); }
/* settings */
.set { flex:1; padding:22px 26px; display:grid; grid-template-columns:1fr 1fr; gap:22px; align-content:start; }
.sec { display:flex; flex-direction:column; gap:10px; }
.sec h3 { margin:0; font-size:14px; }
.pal { display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:10px; background:var(--soft); }
.sw { display:flex; } .sw i { width:14px; height:18px; display:block; }
.flow { display:flex; gap:6px; align-items:center; font-size:12px; color:var(--dim); }
.flow b { color:var(--ink); }
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
// ---------- placeholder pixel art (procedural, seeded) ----------
function rng(s){return()=>((s=Math.imul(s^s>>>15,1|s)+0x6D2B79F5|0)>>>0)/4294967296;}
const NIGHT=["#0d1026","#1a1f45","#2c3470","#4b5aa3","#e9d8a6","#f2a541","#122033","#1f3a4d","#2f5d6e","#5b8c85","#3b2a28","#6b4a3a"];
function scene(c,seed,variant){ // 160x90 harbour scene
  const W=160,H=90,x=c.getContext("2d");c.width=W;c.height=H;const r=rng(seed);
  for(let y=0;y<54;y++)for(let i=0;i<W;i++){const t=y/54+((i+y)%2?0.04:0)*(r()<.5);x.fillStyle=NIGHT[t<.3?0:t<.6?1:t<.85?2:3];x.fillRect(i,y,1,1);}
  for(let k=0;k<40;k++){x.fillStyle=NIGHT[4];x.fillRect(r()*W|0,r()*40|0,1,1);}
  x.fillStyle=NIGHT[4];x.beginPath();x.arc(124,16,7,0,7);x.fill();
  for(let y=54;y<H;y++)for(let i=0;i<W;i++){x.fillStyle=NIGHT[6+((y+(i>>3))%3===0?1:0)+(y>72?1:0)];x.fillRect(i,y,1,1);}
  for(let y=56;y<H;y+=3){x.fillStyle=NIGHT[4];x.fillRect(120+((y*7)%9)-4,y,6-(y-56)/8,1);}
  x.fillStyle=NIGHT[10];x.fillRect(0,50,58,6);x.fillStyle=NIGHT[11];for(let i=2;i<58;i+=8)x.fillRect(i,56,2,10);
  x.fillStyle=NIGHT[5];x.fillRect(46,36,2,14);x.fillRect(44,34,6,3);
  const boat=(bx,by,s)=>{x.fillStyle=NIGHT[10];x.fillRect(bx,by,22*s,4*s);x.fillRect(bx+2*s,by+4*s,18*s,2*s);x.fillStyle=NIGHT[11];x.fillRect(bx+9*s,by-14*s,1*s,14*s);if(variant>0){x.fillStyle=NIGHT[4];x.fillRect(bx+10*s,by-12*s,6*s,8*s);}};
  boat(70,58,1);boat(100,64,1);
  if(variant===0){x.fillStyle="#ff00ff";x.fillRect(80,61,1,1);x.fillRect(84,60,1,1);x.fillStyle="#9aa";x.fillRect(30,20,1,1);}
  return c;
}
function sprite(c,seed){const W=32,H=32,x=c.getContext("2d");c.width=W;c.height=H;const r=rng(seed);
  const col=["#2b1d1d","#f0c39a","#3d6b8c","#6c2f2f","#e9d8a6","#1d2b3d"];
  const px=(a,b,w,h,k)=>{x.fillStyle=col[k];x.fillRect(a,b,w,h);};
  px(12,4,8,8,1);px(12,3,8,3,3);px(13,7,1,1,0);px(18,7,1,1,0);px(11,12,10,10,2);px(9,13,2,8,2);px(21,13,2,8,2);px(12,22,3,8,5);px(17,22,3,8,5);px(14,14,4,1,4);
  if(seed%2){px(10,2,12,2,0);}return c;}
function prop(c,seed){const x=c.getContext("2d");c.width=24;c.height=24;x.fillStyle="#6b4a3a";x.fillRect(4,8,16,12);x.fillStyle="#3b2a28";x.fillRect(4,8,16,2);x.fillRect(4,14,16,1);x.fillStyle="#f2a541";x.fillRect(11,11,2,3);return c;}
function cv(fn,seed,v,scale){const c=document.createElement("canvas");fn(c,seed,v);c.style.width=(c.width*scale)+"px";c.style.height=(c.height*scale)+"px";return c;}
// ---------- shared parts ----------
const P=new URLSearchParams(location.hash.slice(1).replace(/,/g,"&"));
const S=location.hash.slice(1).split(",")[0]||"s01";
if(location.hash.includes("dark"))document.documentElement.dataset.theme="dark";
const AV={you:'<span class="av a-you">Y</span>',ai:'<span class="av a-ai">AI</span>',script:'<span class="av a-script">S</span>'};
function topbar(crumb,ai=true){return `<div class="top"><div class="row"><div class="brand">pixelwright</div><span class="dim">/</span>${crumb}</div>
<div class="row"><span class="legend small">${AV.you} You ${AV.ai} AI ${AV.script} Scripts</span><span class="status"><span class="led ${ai?"":"off"}"></span>${ai?"AI listening":"No AI session: requests wait"}</span>${ai?`<span class="btn flat sm">⚙ Project</span>`:""}</div></div>`;}
const assets=[
 ["harbour-night","scenes","wip",scene,11,1,"You: decide on 3 pieces of advice","you"],
 ["harbour-day","scenes","wip",scene,12,0,"AI: answering your request","ai"],
 ["tavern-inside","scenes","new",scene,13,0,"Scripts: normalise the input","script"],
 ["lighthouse","scenes","ok",scene,14,1,"Approved · exported","none"],
 ["captain","characters","wip",sprite,3,0,"AI: critique and fix v002","ai"],
 ["sailor","characters","new",sprite,4,0,"You: add a starting image","you"],
 ["crate","props","ok",prop,1,0,"Approved · exported","none"],
];
const stateTxt={new:"New",wip:"Working",ok:"Approved"};
function projectScreen(){
  const groups=[["All assets",7],["scenes",4],["characters",2],["props",1]];
  return topbar('<b>my-game-art</b> <span class="dim small mono">~/art/my-game-art</span>')+`<div class="body">
  <div class="card side"><div class="h">Groups</div>${groups.map((g,i)=>`<div class="navi ${i==0?"on":""}"><span>${g[0]}</span><span class="n">${i?"⋯ ":""}${g[1]}</span></div>`).join("")}
   <div class="h" style="margin-top:14px">Waiting on</div>
   <div class="navi"><span class="next">${AV.you} You</span><span class="n">2</span></div>
   <div class="navi"><span class="next">${AV.ai} AI</span><span class="n">2</span></div>
   <div class="navi"><span class="next">${AV.script} Scripts</span><span class="n">1</span></div></div>
  <div class="card main"><div class="row" style="justify-content:space-between"><div><b style="font-size:16px">All assets</b> <span class="dim small">· 7</span></div>
   <div class="row"><span class="btn ghost sm">Sort: needs you first ▾</span><span class="btn ghost sm">Show: all states ▾</span><span class="btn pri sm">+ New asset</span></div></div>
   <div class="grid" id="grid"></div></div></div>`;}
function fillGrid(){const g=document.getElementById("grid");if(!g)return;
  assets.forEach(a=>{const d=document.createElement("div");d.className="asset";
    d.innerHTML=`<div class="thumb"></div><div class="info"><div class="row" style="justify-content:space-between"><b>${a[0]}</b><span class="chip ${a[2]}">${stateTxt[a[2]]}</span></div>
    <div class="next">${a[7]!=="none"?AV[a[7]]:'<span class="av" style="background:var(--ok)">✓</span>'}<span>${a[6]}</span></div></div>`;
    d.querySelector(".thumb").append(cv(a[3],a[4],a[5],a[3]===scene?1:a[3]===sprite?3:4));g.append(d);});
  const drop=document.createElement("div");drop.className="drop";drop.innerHTML="<b style='color:var(--ink)'>Drop an image here</b><span>sketch, AI output, photo…</span><span>it becomes a new asset</span>";g.append(drop);}
function versions(on,extra=""){const vs=[["v001","S","script","input → normalised"],["v002","S","script",""],["v003","AI","ai",""],["v004","Y","you",""]];
  return `<div class="strip"><div class="ver"><div class="t" data-v="in"></div><span>input</span></div><span class="arrow">→</span>${vs.map((v,i)=>`<div class="ver ${v[0]===on?"on":""}"><div class="t" data-v="${i}"></div><span class="by">${AV[v[2]].replace('class="av','style="width:14px;height:14px;font-size:8px" class="av')} ${v[0]}${i===0||i===2?" ★":""}</span></div>`).join("")}${extra}
  <div style="flex:1"></div><span class="dim small" style="padding-bottom:20px">Keeping all versions</span></div>`;}
function adviceList(mode){
  const items=[
   ["script","1","Two stray pixels outside the palette on the left boat","Rule: palette only (R-PAL-1) · fix: snap to nearest colour",true],
   ["ai","2","The moon reflection is too regular; break it into 3 uneven strokes","AI critique · fix ready (new version)",true],
   ["script","3","Isolated pixel in the sky reads as noise","Rule: orphan pixels (R-PIX-4) · fix: remove",true],
  ];
  let h=items.map((it,i)=>`<div class="adv ${i===(mode==="reject"?2:1)?"sel":""}"><span class="av a-${it[0]}">${it[1]}</span><div><div class="msg">${it[2]}</div><div class="why"><b class="t-${it[0]}">${{script:"Scripts",ai:"AI",you:"You"}[it[0]]}</b> · ${it[3]}</div>
   ${mode==="reject"&&i===2?`<div class="reject"><b>Why reject?</b><div class="field txt">Stars are meant to be single pixels in this style</div>
   <span class="chk"><span class="cb on">✓</span>Remember this as a style rule for</span>
   <div class="row" style="gap:14px;padding-left:23px"><span class="chk"><span class="rad"></span>asset</span><span class="chk"><span class="rad on"></span>scenes</span><span class="chk"><span class="rad"></span>project</span></div>
   <div class="row"><span class="btn no sm">Reject</span><span class="btn flat sm">Cancel</span></div></div>`:
   `<div class="acts"><span class="btn pri sm">Accept</span><span class="btn ghost sm">Reject…</span><span class="btn flat sm">Show</span></div>`}</div></div>`).join("");
  if(mode==="request")h+=`<div class="adv sel"><span class="av a-you">4</span><div><div class="msg">Outline of the right boat is too thick here</div><div class="why"><b class="t-you">You</b> · request to the AI · area marked</div><div class="wait" style="margin-top:6px"><span class="led"></span>Sent · the AI picked it up 4 s ago</div></div></div>`;
  h+=`<div class="hist small">▸ History · 5 accepted, 1 rejected</div>`;
  return h;}
function assetScreen(mode){
  const right=mode==="compare"?"before":"";
  return topbar('<span class="btn flat sm">← scenes</span> <b>harbour-night</b> <span class="chip wip">Working</span>')+`<div class="body">
  <div class="card work"><div class="cbar"><div class="seg"><span class="${mode==="compare"?"":"on"}">Image</span><span class="${mode==="compare"?"on":""}">Before / after</span></div>
   <div class="row"><span class="btn ghost sm">ⓘ Asset settings</span><span class="btn ghost sm">Open in Aseprite</span></div></div>
   <div class="canvasbox" id="cbox"><div class="zoom"><span class="btn flat sm">−</span><span class="small">${mode==="compare"?"Fit · linked":"Fit"}</span><span class="btn flat sm">+</span></div><div class="hint small">Scroll to zoom · drag to move${mode==="compare"?" · both sides move together":""}</div></div>${versions("v004")}</div>
  <div class="card panel"><div class="hd"><b>Advice on v004</b><span class="dim small">3 pending</span></div>
   <div class="list">${adviceList(mode)}</div>
   <div class="ask"><div class="field">Ask the AI about this version…</div><div class="row" style="justify-content:space-between"><span class="btn ghost sm">✎ Mark an area</span><span class="btn ai sm">Send to AI</span></div><span class="dim small">Goes to your AI session (Claude Code, listening). Its answer appears in this list.</span></div>
   <div style="padding:0 12px 12px"><div class="btn pri" style="width:100%;justify-content:center">Approve v004 and export</div></div></div></div>`;}
function fillAsset(mode){const b=document.getElementById("cbox");if(!b)return;
  if(mode==="compare"){[["v003",0],["v004",1]].forEach(([t,v])=>{const w=document.createElement("div");w.style.position="relative";w.append(cv(scene,11,v,2.6));const l=document.createElement("span");l.className="lbl";l.style.left="8px";l.textContent=t;w.append(l);b.append(w);});}
  else{const w=document.createElement("div");w.style.position="relative";w.append(cv(scene,11,1,4.4));
    const mk=(n,c,l,t)=>{const m=document.createElement("span");m.className="mk a-"+c;m.textContent=n;m.style.left=l+"px";m.style.top=t+"px";w.append(m);};
    mk(1,"script",330,250);mk(2,"ai",520,265);mk(3,"script",125,85);
    const bx=document.createElement("span");bx.className="box";bx.style.cssText="left:500px;top:240px;width:70px;height:120px;border-color:var(--ai)";w.append(bx);

    b.append(w);}
  document.querySelectorAll(".ver .t").forEach((t,i)=>t.append(cv(scene,11,i<2?0:1,0.5)));}

function guide(step){

   2:["Every asset says what happens next","…and who does it: you, the AI or the scripts. Start with the one waiting on you.",{l:262,t:106,w:248,h:194},{l:530,t:120}],
   3:["You decide here","Advice comes from the scripts and the AI. Accept it and a new version appears; reject it and say why.",{l:930,t:56,w:340,h:734},{l:570,t:200}]};
  const s=steps[step];
  return `<div class="spot" style="left:${s[2].l}px;top:${s[2].t}px;width:${s[2].w}px;height:${s[2].h}px"></div>

  <div class="row" style="justify-content:space-between"><div class="dots">${[1,2,3,4,5,6].map(i=>`<i class="${i==step?"on":""}"></i>`).join("")}</div><div class="row"><span class="btn flat sm">Skip the tour</span><span class="btn pri sm">Next</span></div></div></div>`;}
function settings(){return topbar('<b>my-game-art</b> <span class="dim">/</span> <span>Project settings</span>')+`<div class="body"><div class="card set">
  <div class="sec"><h3>Palettes</h3><span class="dim small">A library of palettes. Groups pick a default; an asset can override it or use several.</span>
   ${[["main",["#22262b","#6b4a3a","#e9d8a6","#f2a541","#5b8c85","#2c3470"],"default"],["night",NIGHT.slice(0,8),"group scenes"],["characters",["#2b1d1d","#f0c39a","#3d6b8c","#6c2f2f","#e9d8a6","#1d2b3d"],"group characters"]].map(p=>`<div class="pal"><b style="width:86px">${p[0]}</b><span class="sw">${p[1].map(c=>`<i style="background:${c}"></i>`).join("")}</span><span class="dim small" style="margin-left:auto">${p[2]}</span></div>`).join("")}
   <span class="btn ghost sm" style="align-self:flex-start">+ Import palette (.gpl, .hex, .png)</span></div>
  <div class="sec"><h3>Canvas</h3><div class="row"><span class="field txt mono">320</span>×<span class="field txt mono">180</span><span class="dim small">default · a group overrides it from its ⋯ menu, an asset from ⓘ Asset settings</span></div>
   <h3 style="margin-top:10px">Export</h3><div class="field txt mono">../game/assets/art</div><span class="dim small">Approved images are copied here. Can point inside your engine's project.</span>
   <h3 style="margin-top:10px">History</h3><span class="chk"><span class="cb on">✓</span>Keep all versions</span><span class="dim small">When off, pixelwright keeps the input, the first version, starred versions and the final.</span>
   <h3 style="margin-top:10px">Style rules</h3><span class="dim small">14 rules on · 2 learnt from your rejections</span><span class="btn ghost sm" style="align-self:flex-start">Review rules…</span></div></div></div>`;}
